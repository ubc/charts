apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cardscanner.fullname" . }}-worker
  labels:
    {{- include "cardscanner.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      component: {{ include "cardscanner.fullname" . }}-worker
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "cardscanner.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        component: {{ include "cardscanner.fullname" . }}-worker
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "cardscanner.serviceAccountName" . }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}-worker
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.worker.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          command: ['php', 'artisan', 'queue:listen']
          env:
            - name: APP_NAME
              value: {{ .Values.app.name | quote }}
            - name: APP_ENV
              value: {{ .Values.app.env | quote }}
            {{- if .Values.existingSecret }}
            - name: APP_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: app_key
            {{- else }}
            - name: APP_KEY
              value: {{ required "app.key is required (or set existingSecret)" .Values.app.key | quote }}
            {{- end }}
            - name: APP_DEBUG
              value: {{ .Values.app.debug | quote }}
            - name: APP_TIMEZONE
              value: {{ .Values.app.timezone | quote }}
            - name: APP_URL
              value: {{ .Values.app.url | quote }}
            - name: APP_PORT
              value: {{ .Values.app.port | quote }}
            - name: BCRYPT_ROUNDS
              value: {{ .Values.app.bcryptRounds | quote }}
            - name: DB_CONNECTION
              value: {{ .Values.db.connection | quote }}
            - name: DB_HOST
              value: {{ .Values.db.host | quote }}
            - name: DB_PORT
              value: {{ .Values.db.port | quote }}
            - name: DB_DATABASE
              value: {{ .Values.db.name | quote }}
            - name: DB_USERNAME
              value: {{ .Values.db.name | quote }}
            {{- if .Values.existingSecret }}
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: db_password
            {{- else }}
            - name: DB_PASSWORD
              value: {{ required "db.pass is required (or set existingSecret)" .Values.db.pass | quote }}
            {{- end }}
            - name: CARDAPI_URL
              value: {{ .Values.app.cardapi.url | quote }}
            - name: CARDAPI_ID
              value: {{ .Values.app.cardapi.id | quote }}
            {{- if .Values.existingSecret }}
            - name: CARDAPI_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: cardapi_secret
            {{- else }}
            - name: CARDAPI_SECRET
              value: {{ required "app.cardapi.secret is required (or set existingSecret)" .Values.app.cardapi.secret | quote }}
            {{- end }}
            - name: LTI_PLATFORM_NAME
              value: {{ .Values.lti.platform.name | quote }}
            - name: LTI_PLATFORM_URL
              value: {{ .Values.lti.platform.url | quote }}
            - name: LTI_PLATFORM_ISS
              value: {{ .Values.lti.platform.iss | quote }}
            - name: LTI_PLATFORM_AUTH_URL
              value: {{ .Values.lti.platform.authUrl | quote }}
            - name: LTI_PLATFORM_JWKS_URL
              value: {{ .Values.lti.platform.jwksUrl | quote }}
            - name: LTI_PLATFORM_ACCESS_TOKEN_URL
              value: {{ .Values.lti.platform.accessTokenUrl | quote }}
            - name: LTI_NAME
              value: {{ .Values.lti.name | quote }}
            - name: LTI_CLIENT_ID
              value: {{ .Values.lti.clientId | quote }}
            - name: LTI_DEPLOYMENT_ID
              value: {{ .Values.lti.deploymentId | quote }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
