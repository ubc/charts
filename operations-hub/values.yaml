# Default values for operations-hub.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# This will set the replicaset count more information can be found here: https://kubernetes.io/docs/concepts/workloads/controllers/replicaset/
replicaCount: 1

# This sets the container image more information can be found here: https://kubernetes.io/docs/concepts/containers/images/
image:
  repository: nginx
  # This sets the pull policy for images.
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

# This is for the secrets for pulling an image from a private repository more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/
imagePullSecrets: []
# This is to override the chart name.
nameOverride: ""
fullnameOverride: ""

# This is for setting Kubernetes Annotations to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/
podAnnotations: {}
# This is for setting Kubernetes Labels to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/
podLabels: {}

# This is for setting up a service more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/
service:
  # This sets the service type more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#publishing-services-service-types
  type: ClusterIP
  # This sets the ports more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#field-spec-ports
  port: 80

# This block is for setting up the ingress for more information can be found here: https://kubernetes.io/docs/concepts/services-networking/ingress/
ingress:
  enabled: false
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  host: chart-example.local

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

# This is to setup the liveness and readiness probes more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/
livenessProbe:
  httpGet:
    path: /
    port: http
readinessProbe:
  httpGet:
    path: /
    port: http

# This section is for setting up autoscaling more information can be found here: https://kubernetes.io/docs/concepts/workloads/autoscaling/
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 2
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

# Additional volumes on the output Deployment definition.
volumes: []
# - name: foo
#   secret:
#     secretName: mysecret
#     optional: false

# Additional volumeMounts on the output Deployment definition.
volumeMounts: []
# - name: foo
#   mountPath: "/etc/foo"
#   readOnly: true

nodeSelector: {}

tolerations: []

affinity: {}

db:
  name: operations_hub
  host: somehost
  secret:
    path: operations-hub/db
    usernameKey: username
    passwordKey: password

app:
  flask:
    env: production
    secretKey: BzioL2JzzQlxwWpE6B00rn7tlzxTscZj
    debug: 0 # debug 0 disables flask dev server for gunicorn
  gunicorn:
    workers: 3
    timeout: 60
  port: 5000
  smtp:
    host: ''
    port: 25
    useTls: 1
    useSsl: 0
  pvc:
    uploads:
      annotations:
        nfs.io/storage-path: "nfs/uploads"
      storageClass: "nfs"
      accessMode: ReadWriteMany
      size: 2Gi

  # SAML SSO. Off by default: with these unset the app returns 404 from
  # /auth/saml/metadata rather than serving metadata it cannot sign.
  #
  # Registering an SP is a two-way exchange, so this is deliberately usable in two
  # stages — set everything except idpMetadata to publish /auth/saml/metadata and
  # hand it to UBC IAM, then add idpMetadata from what they send back to enable
  # sign-in. Note that this block only supplies configuration; showing the SSO
  # button on the login page is a separate `auth_saml_enabled` setting stored in
  # the database.
  saml:
    enabled: false
    # The SP's entity id. Conventionally this service's metadata URL.
    spEntityId: ''
    # Public origin of this service, no trailing slash. The ACS URL the app
    # advertises is derived from it as <baseUrl>/auth/saml/acs.
    baseUrl: ''
    # UBC IAM's metadata XML. With idpMetadataUrl set this is the fallback baseline
    # used when a fetch fails; keep it populated with a known-good copy, because a
    # failed fetch with no baseline stops the pod. Without idpMetadataUrl it is the
    # only source.
    idpMetadata: ''
    # Set to fetch IdP metadata at pod start instead of pasting it above, so
    # certificate rotation is picked up without a values edit. Empty disables the
    # whole mechanism.
    #   staging: https://authentication.stg.id.ubc.ca/idp/shibboleth
    #   prod:    https://authentication.ubc.ca/idp/shibboleth
    idpMetadataUrl: ''
    # Required when idpMetadataUrl is set. The fetched document must declare this
    # entity id or it is rejected. UBC publishes unsigned metadata, so this is the
    # only integrity check available beyond TLS.
    idpEntityId: ''
    # Timeout in seconds for fetching IdP metadata. Exceeding this timeout is treated
    # as a fetch failure, which falls back to the idpMetadata baseline. The pod will
    # not fail if a fetch times out and a baseline is available.
    idpFetchTimeout: 15
    contact:
      name: 'LTIC Operations Hub'
      email: ''
    # Days the published metadata stays valid. 0 keeps the python3-saml default of
    # 2 days, which suits a URL the IdP re-fetches; raise it when the file is being
    # emailed once and has to outlive the exchange.
    metadataValidDays: 0
    # SP signing keypair in Vault. Never put the private key in a values file.
    secret:
      path: operations-hub/saml
      certKey: cert
      privateKey: key
