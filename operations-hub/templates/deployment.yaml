{{- include "operations-hub.saml.validate" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "operations-hub.fullname" . }}
  labels:
    {{- include "operations-hub.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "operations-hub.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "operations-hub.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.app.port }}
              protocol: TCP
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
            {{- include "operations-hub.podEnv" . | nindent 12 }}
          volumeMounts:
            - name: operations-hub-uploads
              mountPath: /app/instance/uploads
            {{- if .Values.app.saml.enabled }}
            - name: operations-hub-saml
              mountPath: {{ include "operations-hub.saml.mountPath" . }}
              readOnly: true
            {{- end }}
            {{- if and .Values.app.saml.enabled (or .Values.app.saml.idpMetadata .Values.app.saml.idpMetadataUrl) }}
            - name: operations-hub-saml-idp
              mountPath: {{ include "operations-hub.saml.idpDir" . }}
              readOnly: true
            {{- end }}
      volumes:
        - name: operations-hub-uploads
          persistentVolumeClaim:
            claimName: {{ template "operations-hub.fullname" . }}-uploads-pvc
        {{- if .Values.app.saml.enabled }}
        {{- /*
          Projected so the Vault-backed cert and key land in a single directory —
          the app expects both files side by side. The IdP metadata used to be a
          source here too; it now has its own mount (operations-hub-saml-idp)
          because a later init container needs to write it, and this one stays
          read-only.

          0444: these are mounted root-owned because the pod sets no fsGroup, and the
          app runs as uid 10001, so anything narrower is unreadable by the process that
          needs it. Adding fsGroup instead would force a recursive chown of the NFS
          uploads PVC on every start, which is the more expensive trade.
        */}}
        - name: operations-hub-saml
          projected:
            defaultMode: 0444
            sources:
              - secret:
                  name: {{ include "operations-hub.fullname" . }}-saml
                  items:
                    - key: cert
                      path: sp.crt
                    - key: key
                      path: sp.key
        {{- end }}
        {{- if and .Values.app.saml.enabled (or .Values.app.saml.idpMetadata .Values.app.saml.idpMetadataUrl) }}
        - name: operations-hub-saml-idp
          {{- if .Values.app.saml.idpMetadataUrl }}
          {{- /* Written by the fetch init container, so it must be writable. */}}
          emptyDir: {}
          {{- else }}
          configMap:
            name: {{ include "operations-hub.fullname" . }}-saml-idp
            items:
              - key: idp-metadata.xml
                path: idp-metadata.xml
          {{- end }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
