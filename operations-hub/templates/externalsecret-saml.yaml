{{- if .Values.app.saml.enabled }}
{{- /*
  The SP signing keypair, pulled from Vault rather than carried in a values file.
  The private key is what lets anything impersonate this SP to UBC IAM, so it must
  not live in the configuration repo — the public half is published at
  /auth/saml/metadata by design, the private half never leaves the pod.
*/}}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "operations-hub.fullname" . }}-saml
  labels:
    {{- include "operations-hub.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: {{ include "operations-hub.fullname" . }}-saml
    creationPolicy: Owner
  data:
    - secretKey: cert
      remoteRef:
        key: {{ .Values.app.saml.secret.path }}
        property: {{ .Values.app.saml.secret.certKey }}
    - secretKey: key
      remoteRef:
        key: {{ .Values.app.saml.secret.path }}
        property: {{ .Values.app.saml.secret.privateKey }}
{{- end }}
