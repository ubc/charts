# Default values for score.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# This will set the replicaset count more information can be found here: https://kubernetes.io/docs/concepts/workloads/controllers/replicaset/
replicaCount: 1

# This sets the container image more information can be found here: https://kubernetes.io/docs/concepts/containers/images/
image:
  repository: ghcr.io/ubc/score-hiring-reviews
  # This sets the pull policy for images.
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""
  # Pull secrets set by GitLab Auto Deploy (gitlab-registry-<project>); merged
  # with imagePullSecrets below.
  secrets: []

# This is for the secrets for pulling an image from a private repository more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/
imagePullSecrets: []
# This is to override the chart name.
nameOverride: ""
fullnameOverride: ""

# This is for setting Kubernetes Annotations to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/
podAnnotations: {}
# This is for setting Kubernetes Labels to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/
podLabels: {}

# The image runs as UID 10001 in group 0 and writes nothing to disk, so the
# root filesystem is read-only; /tmp is an emptyDir for gunicorn.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 0
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# This is for setting up a service more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/
service:
  # This sets the service type more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#publishing-services-service-types
  type: ClusterIP
  # This sets the ports more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#field-spec-ports
  port: 80

# This block is for setting up the ingress for more information can be found here: https://kubernetes.io/docs/concepts/services-networking/ingress/
# Releases add their own annotations (e.g. kubernetes.io/tls-acme: "true");
# Helm merges them with these defaults.
ingress:
  enabled: false
  annotations:
    # Bundle uploads can be up to 150 MB (BUNDLE_MAX_UPLOAD_BYTES). Without
    # this, ingress-nginx rejects anything over 1 MB with a 413.
    nginx.ingress.kubernetes.io/proxy-body-size: 150m
    # Bundles contain personal information and the app keeps them off disk.
    # By default nginx writes large request bodies to a temp file on the
    # controller; with buffering off it streams them to the pod instead.
    # An upload then holds a sync worker while it arrives, so
    # app.gunicorn.timeout (and the release's proxy-read-timeout) must cover
    # a 150 MB upload over a slow connection.
    nginx.ingress.kubernetes.io/proxy-request-buffering: "off"
  host: chart-example.local

# Uploads are held in memory while they're processed, and redaction uses a
# few times the bundle size. Rule of thumb for the limit:
#   baseline + app.gunicorn.workers x a few x BUNDLE_MAX_UPLOAD_BYTES
# Going over it OOM-kills the whole pod (every worker and any running
# redaction), not just the request. The default fits about one large upload
# at a time with 3 workers; raise the limit, or lower the workers, if several
# people upload large bundles at once.
resources:
  requests:
    cpu: 100m
    memory: 512Mi
  limits:
    memory: 1536Mi

# This is to setup the liveness and readiness probes more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/
# /healthz doesn't touch the database; /readyz does and returns 503 while it's unavailable.
# The same sync workers answer the probes and handle uploads, so liveness
# allows about 2 minutes of busy workers before kubelet restarts the pod (a
# restart also kills any running bundle redaction).
livenessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 10
  periodSeconds: 20
  timeoutSeconds: 5
  failureThreshold: 6
readinessProbe:
  httpGet:
    path: /readyz
    port: http
  periodSeconds: 10
  timeoutSeconds: 5

# This section is for setting up autoscaling more information can be found here: https://kubernetes.io/docs/concepts/workloads/autoscaling/
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 2
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

# Additional volumes on the output Deployment definition.
volumes: []
# - name: foo
#   secret:
#     secretName: mysecret
#     optional: false

# Additional volumeMounts on the output Deployment definition.
volumeMounts: []
# - name: foo
#   mountPath: "/etc/foo"
#   readOnly: true

nodeSelector: {}

tolerations: []

affinity: {}

# Name of an existing Secret (e.g. synced from Vault by an ExternalSecret) holding
# the app's credentials. When set, db.password, app.secretKey and
# app.smtp.password are ignored and the Secret must provide:
#   db_password    -> POSTGRES_PASSWORD
#   secret_key     -> SECRET_KEY (32+ random characters; changing it signs everyone out)
#   mail_password  -> MAIL_PASSWORD (optional, only if the mail server needs a login)
existingSecret: ""

db:
  name: score
  username: score
  # No default on purpose: this file is public. Provide it per release, or use Vault (existingSecret).
  # Use URL-safe characters only: the app builds the database URL from it unescaped.
  password: ""
  host: somehost
  port: 5432

app:
  # production (the default), development or testing
  env: production
  # No default on purpose: this file is public. Provide it per release, or use Vault (existingSecret).
  secretKey: ""
  port: 8000
  gunicorn:
    workers: 3
    # Seconds a single request may take, including receiving the upload
    # (ingress buffering is off). 300 covers 150 MB at about 5 Mbps.
    timeout: 300
  # Number of proxies in front of the pod. Must be right, or client IPs (and
  # so the sign-in throttle) are wrong.
  trustProxyHops: 1
  # Proxy address range gunicorn trusts for X-Forwarded-Proto.
  forwardedAllowIps: ''
  displayTimezone: America/Vancouver
  contactEmail: ''
  # Set to 0 to turn off email-and-password sign-in once SSO is enabled.
  localSigninEnabled: 1
  smtp:
    # Leave host empty to skip email (recorded as "skipped" in the app).
    host: ''
    port: 25
    useTls: 1
    username: ''
    # No default on purpose: this file is public. Provide it per release, or use Vault (existingSecret).
    password: ''
    sender: ''

# Extra environment variables for the app, e.g.
#   - name: BUNDLE_MAX_UPLOAD_BYTES
#     value: "157286400"
extraEnv: []

# Database migration Job — Helm pre-install/pre-upgrade hook that runs
# `flask db upgrade` and `flask permissions sync` once per release revision
# before any pod is created.
# The pods then start with RUN_MIGRATIONS=0. Disable it to have every pod run
# the migrations at start-up instead (also safe: each upgrade takes a
# Postgres advisory lock).
migrations:
  enabled: true
  backoffLimit: 1
  # Keeps a failed Job and its logs for a day. The next release deletes the
  # old Job anyway (before-hook-creation).
  ttlSecondsAfterFinished: 86400
  resources: {}
    # requests:
    #   cpu: 50m
    #   memory: 128Mi

# Daily `flask prune`: clears old sign-in throttle records and expired
# document-upload jobs.
prune:
  enabled: true
  schedule: "17 3 * * *"
  resources: {}
