{{- if .Values.cronjob.lti_update_classlist.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "webwork.fullname" . }}-classlist-cronjob
  labels:
    {{- include "webwork.labels" . | nindent 4 }}
    tier: cronjob
spec:
  schedule: {{ .Values.cronjob.lti_update_classlist.schedule | quote }}
  {{- if .Values.cronjob.lti_update_classlist.startingDeadlineSeconds }}
  startingDeadlineSeconds: {{ .Values.cronjob.lti_update_classlist.startingDeadlineSeconds }}
  {{- end }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: {{ .Values.cronjob.successfulJobsHistoryLimit }}
  failedJobsHistoryLimit: {{ .Values.cronjob.failedJobsHistoryLimit }}
  jobTemplate:
    spec:
      # Finished Jobs (success or failure) are deleted after the TTL so a
      # failed run can't pin a KubeJobFailed alert forever.
      ttlSecondsAfterFinished: {{ .Values.cronjob.ttlSecondsAfterFinished }}
      backoffLimit: {{ .Values.cronjob.backoffLimit }}
      template:
        spec:
          restartPolicy: {{ .Values.cronjob.lti_update_classlist.restartPolicy }}
          {{- if .Values.logShipping.enabled }}
          initContainers:
            {{- include "webwork.logShipper.initContainers" . | nindent 10 }}
          {{- end }}
          containers:
          - name: {{ .Chart.Name }}-classlist-cronjob
            {{- include "webwork.app.spec" . | indent 12 }}
            {{- with .Values.cronjob.resources }}
            resources:
              {{- toYaml . | nindent 14 }}
            {{- end }}
            args: [{{ include "webwork.dropPrivPrefix" . }} './lib/LTI1p3/Cron/lti_update_classlist.pl']
          volumes:
            {{- include "webwork.app.mounts" . | indent 10 }}
{{- end }}

