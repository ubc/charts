# Pulls ONLY the ServiceNow API credentials from Vault (via a ClusterSecretStore)
# and writes them into the k8s Secret the CronJob consumes with envFrom.
# SMTP creds are deliberately not here — the internal relay needs no auth.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "ats.secretName" . }}
  labels:
    {{- include "ats.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval | quote }}
  secretStoreRef:
    name: {{ .Values.externalSecrets.secretStoreRef.name }}
    kind: {{ .Values.externalSecrets.secretStoreRef.kind }}
  target:
    name: {{ include "ats.secretName" . }}
    creationPolicy: Owner
    template:
      metadata:
        labels:
          {{- include "ats.labels" . | nindent 10 }}
  data:
    - secretKey: SERVICENOW_USERNAME
      remoteRef:
        key: {{ .Values.externalSecrets.servicenow.path | quote }}
        property: {{ .Values.externalSecrets.servicenow.usernameProperty | quote }}
    - secretKey: SERVICENOW_PASSWORD
      remoteRef:
        key: {{ .Values.externalSecrets.servicenow.path | quote }}
        property: {{ .Values.externalSecrets.servicenow.passwordProperty | quote }}
