apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccount.name }}
  labels:
    {{- include "ats.labels" . | nindent 4 }}
{{- with .Values.imagePullSecrets }}
# Attaching pull secrets to the SA means every pod it runs (incl. the CronJob)
# inherits them without repeating the list on each pod spec.
imagePullSecrets:
  {{- toYaml . | nindent 2 }}
{{- end }}
